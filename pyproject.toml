[project]
name = "axile"
version = "0.0.1"
description = "axile 算法交易执行框架（开发中）"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "zengbin93"}]
keywords = ["trading", "execution", "algorithmic-trading"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/zengbin93/axile"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axile"]
