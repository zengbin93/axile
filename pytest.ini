[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    -s
    --strict-markers
    --tb=short
    --ignore=tests/unit/skills

markers =
    unit: Unit tests
    integration: Integration tests
    live: Live tests requiring real environment
    slow: Slow tests
    ctp: CTP channel related tests
    server: Server module tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
